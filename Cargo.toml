[package]
name = "swissarmynes"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["emulator"]
exclude = [".tools/tetanes-core"]

[patch.crates-io]
tetanes-core = { path = ".tools/tetanes-core" }

[dependencies]
axum = "0.7"
base64 = "0.22.1"
rs6502 = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
swiss-emulator = { path = "emulator" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = ["fs", "set-header"] }

[dev-dependencies]
tetanes-core = "=0.12.2"
